<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Culture IA - INSERSITE</title>

    <!-- Police lisible (meilleure que Orbitron pour les yeux) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- ================= PAGE LOGIN ================= -->
        <div id="loginPage">
            <h1>Quiz Culture IA</h1>
            <p>Teste tes connaissances et découvre comment l’IA peut t’aider au travail</p>

            <input 
                type="text" 
                id="username" 
                placeholder="Nom et prénom"
            >

            <button id="startBtn">🚀 Commencer le quiz</button>
        </div>

        <!-- ================= PAGE QUIZ ================= -->
        <div id="quizPage" style="display:none;">

            <div class="quiz-header">
                <div id="timerDisplay">⏱ Temps restant : 30s</div>
                <div id="scoreDisplay">Score : 0</div>
            </div>

            <div id="questionContainer"></div>

            <!-- bouton valider / suivant injecté par JS -->
        </div>

        <!-- ================= PAGE SCORE ================= -->
        <div id="dashboardPage" style="display:none;">
            <h2>Résultat du quiz</h2>

            <p id="scoreText"></p>

            <h3>Classement des employés</h3>
            <table id="leaderboardTable">
                <thead>
                    <tr>
                        <th>Rang</th>
                        <th>Nom</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <!-- rempli en JS -->
                </tbody>
            </table>

            <button id="backHomeBtn">🏠 Retour à l’accueil</button>
        </div>

    </div>

    <!-- Audio pour applaudissements -->
    <audio id="applauseAudio" preload="auto">
        <source src="applause.mp3" type="audio/mpeg">
    </audio>

    <!-- JS TOUJOURS EN DERNIER -->
    <script src="script.js"></script>

</body>
</html>
